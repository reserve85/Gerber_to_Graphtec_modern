[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gerber2graphtec"
dynamic = ["version"]
description = "Cut SMT solder paste stencils from Gerber files on Graphtec / Silhouette cutters"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6", "ruff"]

[project.scripts]
g2g-cli = "g2g.cli:main"

[project.gui-scripts]
gerber2graphtec = "g2g.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "g2g.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
g2g = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 120  # a hanging (modal) dialog fails with a traceback instead of blocking CI

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["upstream", "tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # size limits: parser and UI builders are long by nature
    "PLR2004",  # magic values
    "PLW0603",  # module level state for theme / language
    "SIM108",
    "PLC0415",  # deliberate lazy imports (platform specific, start-up time)
    "B905",     # zip() without strict: lengths are equal by construction
    "UP031",    # % formatting kept where it mirrors the original protocol code
    "PLR0917",
    "PLW1510",
    "SIM105",
    "RET503",   # "return self.other()" early exits in slots
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"src/g2g/lang_de.py" = ["E501"]
"src/g2g/ui/theme.py" = ["E501"]  # style sheet
"*.spec" = ["F821"]