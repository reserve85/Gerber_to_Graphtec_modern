name: Release

# Two ways to publish a release:
#   1. Actions > Release > Run workflow, enter the new version (e.g. 2.1.0).
#      The workflow writes the version into the source, commits, tags and publishes.
#   2. Push a tag vX.Y.Z yourself (the version in src/g2g/__init__.py must match).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, for example 2.1.0. CHANGELOG.md needs a section for it.'
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version, commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 2.1.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/g2g/__init__.py
          python scripts/release_notes.py "$VERSION" > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION" || echo "version already set"
          git tag -a "v$VERSION" -m "Gerber2Graphtec $VERSION"
          git push origin "HEAD:${{ github.ref_name }}" "v$VERSION"

      - name: Resolve version
        id: version
        run: |
          version=$(sed -n -E 's/^__version__ = "(.*)"/\1/p' src/g2g/__init__.py)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi
          python scripts/release_notes.py "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes and checksums
        run: |
          python scripts/release_notes.py "${{ needs.prepare.outputs.version }}" > notes.md
          (cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" assets/* \
            --title "Gerber2Graphtec ${{ needs.prepare.outputs.version }}" \
            --notes-file notes.md --verify-tag
