name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import g2g; print(g2g.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Build executable
        run: python -m PyInstaller --noconfirm Gerber2Graphtec.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/Gerber2Graphtec.exe "dist/Gerber2Graphtec-${{ steps.version.outputs.version }}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf "Gerber2Graphtec-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" Gerber2Graphtec
          rm Gerber2Graphtec

      - uses: actions/upload-artifact@v4
        with:
          name: Gerber2Graphtec-${{ runner.os }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
