name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Gerber2Graphtec version
      description: Shown at the bottom left of the window and on the About page
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux]
    validations:
      required: true
  - type: input
    id: cutter
    attributes:
      label: Cutter
      placeholder: Silhouette Cameo 3, Portrait 2, ...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Gerber file
      description: >-
        If the problem depends on the file (wrong or missing pads), attach the solder paste
        Gerber as a .zip and name the CAD program that exported it.
